name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate versions and exact tag commit
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/release.py validate "$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}
  binaries:
    needs: [metadata, checks]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package executable for Rokit
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/release.py package "$TAG" "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: release-imposter-baker-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
  package:
    needs: [metadata, checks]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p dist
      - run: wally package --project-path imposter-render --output dist/imposter-render.zip
      - run: rojo build imposter-render/default.project.json --output dist/imposter-render.rbxm
      - name: Build portable Studio demo with embedded textures
        run: |
          mkdir -p test/tooling
          rojo build demo.project.json --output test/tooling/demo-base.rbxl
          cargo run --locked --example build_demo -- test/tooling/demo-base.rbxl dist/demo.rbxl
      - uses: actions/upload-artifact@v4
        with:
          name: release-imposter-render
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [metadata, binaries, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete artifact set and generate SHA-256 checksums
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: python scripts/release.py checksums "$TAG" artifacts
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [[ "$(cat release-state.txt)" != "true" ]]; then
              echo "Release $TAG is already published; refusing to replace its assets."
              exit 1
            fi
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" --draft --verify-tag --prerelease="$PRERELEASE" --title "$TAG" --generate-notes artifacts/*
          fi
          if [[ "$PRERELEASE" == "true" ]]; then latest=false; else latest=true; fi
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
  wally:
    needs: [metadata, publish]
    if: vars.PUBLISH_WALLY == 'true' && needs.metadata.outputs.prerelease == 'false'
    uses: ./.github/workflows/wally.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}
    secrets:
      WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
