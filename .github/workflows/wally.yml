name: Publish Wally package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release version or tag to publish (for example 0.1.1 or v0.1.1)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      WALLY_AUTH_TOKEN:
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: wally-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve version and validate the tagged source
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          cp scripts/release.py "$RUNNER_TEMP/release.py"
          cp scripts/publish_wally.py "$RUNNER_TEMP/publish_wally.py"
          TAG="$(python "$RUNNER_TEMP/release.py" --root "$GITHUB_WORKSPACE" resolve "$REQUESTED_TAG")"
          git checkout --detach "refs/tags/$TAG"
          python "$RUNNER_TEMP/release.py" --root "$GITHUB_WORKSPACE" validate "$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Require an existing published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = 'false'
      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
      - run: mkdir -p test/tooling
      - run: wally package --project-path imposter-render --output test/tooling/imposter-render.zip
      - name: Publish registry package
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
        run: python "$RUNNER_TEMP/publish_wally.py"
